key: iptv-player-on-fire-tv-stick
title: "Putting a real IPTV player on a Fire TV Stick"
sourceLocale: en
status: published
publishNote: >
  Published on the author's decision without a Fire OS device session. What the
  article claims is what the manifest declares — a leanback launcher entry and
  no touchscreen requirement — and Fire OS is Android, so the TV build installs
  and navigates there. The remaining unknowns are cosmetic, not structural:
  where Fire OS files a sideloaded app, and how the Fire remote's ring maps in
  practice. A Fire OS session is still worth running; if it contradicts a
  sentence, correct that sentence rather than pulling the article. Note also
  that the direct APK is behind a tester passcode (commit fe76b99) and a Fire
  TV has no Google Play, so step 2 currently ends at the access-code prompt —
  the same door the Android TV article already leaves readers at.
riskTier: medium
