key: iptv-player-on-fire-tv-stick
title: "Putting a real IPTV player on a Fire TV Stick"
sourceLocale: en
status: held
holdReason: >
  No Fire OS device test has been done. The article says the TV build runs on
  a Fire TV Stick, and every product claim must be true of what ships; Fire OS
  is Android but the remote's key map and the launcher differ. A secondary
  point: the direct APK is behind a tester passcode (commit fe76b99), and a
  Fire TV has no Google Play, so until the gate lifts the walkthrough ends at a
  locked door — existing TV content already tolerates that, so it is not the
  blocker on its own. Publish after a Fire OS session confirms install, D-pad
  focus, playback and phone pairing.
