name: Website CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  astro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No-ops when the app repo is not checked out alongside; catches a stale
      # tokens.css when it is.
      - run: npm run check:tokens
      - run: npm run build
      - run: npm run check:links
